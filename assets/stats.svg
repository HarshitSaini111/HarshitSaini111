      <text x="12" y="16" text-anchor="middle" font-size="11" fill="#ffffff">❖</text>
      <text x="34" y="16" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="13" font-weight="500">Total Repositories:</text>
