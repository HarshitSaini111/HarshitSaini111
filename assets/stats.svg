      <text x="34" y="16" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="13" font-weight="500">Tracked Commits:</text>
      <text x="428" y="16" text-anchor="end" fill="#ffffff" font-family="SF Mono, Monaco, Consolas" font-size="14" font-weight="700">70+</text>
