      <text x="34" y="16" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="13" font-weight="500">Internship Credential:</text>
      <text x="428" y="16" text-anchor="end" fill="#d4d4d8" font-family="SF Mono, Monaco, Consolas" font-size="13" font-weight="600">DecodeLabs</text>
