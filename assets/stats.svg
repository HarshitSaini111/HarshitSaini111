  </defs>
  <rect width="480" height="230" rx="12" fill="url(#cardGradMono)" stroke="#27272a" stroke-width="1.2" />
  <rect x="0" y="0" width="480" height="2" fill="url(#silverLine)" />
  
  <g transform="translate(24, 34)">
