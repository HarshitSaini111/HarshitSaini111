<svg width="1000" height="320" viewBox="0 0 1000 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Obsidian Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="50%" stop-color="#0b0b0d" />
      <stop offset="100%" stop-color="#020202" />
    </linearGradient>

    <!-- Metallic Platinum Title Gradient -->
    <linearGradient id="monoTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f4f4f5" />
      <stop offset="75%" stop-color="#d4d4d8" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>

    <!-- Subtle Edge Platinum Glow -->
    <linearGradient id="edgeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0" />
      <stop offset="30%" stop-color="#52525b" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#52525b" />
      <stop offset="100%" stop-color="#27272a" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Radial Glow in Center -->
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.01" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Minimalist Grid Pattern -->
    <pattern id="monoGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#27272a" stroke-width="0.65" stroke-opacity="0.45" />
      <circle cx="32" cy="32" r="0.8" fill="#ffffff" fill-opacity="0.25" />
    </pattern>

    <!-- Chip Gradient Background -->
    <linearGradient id="chipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseMono {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .title-bold {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Display", Roboto, "Helvetica Neue", sans-serif;
      font-weight: 900;
      letter-spacing: 5px;
    }
    .subtitle-clean {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-weight: 600;
      letter-spacing: 2px;
    }
    .text-mono {
      font-family: "SF Mono", Monaco, Menlo, Consolas, "Courier New", monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .dot-pulse {
      animation: pulseMono 2.5s infinite ease-in-out;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1000" height="320" rx="14" fill="url(#bgGrad)" stroke="#27272a" stroke-width="1.2" />
  <rect width="1000" height="320" rx="14" fill="url(#monoGrid)" />
  <circle cx="500" cy="140" r="320" fill="url(#centerGlow)" />

  <!-- Top Razor Line -->
  <rect x="0" y="0" width="1000" height="2" fill="url(#edgeGlow)" />

  <!-- Top Status / Navigation Row -->
  <g transform="translate(45, 28)">
    <!-- Pill 1: Status -->
    <rect x="0" y="0" width="225" height="28" rx="14" fill="url(#chipBg)" stroke="#3f3f46" stroke-width="1" />
    <circle class="dot-pulse" cx="16" cy="14" r="4" fill="#ffffff" />
    <text x="28" y="18" fill="#a1a1aa" class="text-mono">STATUS: <tspan fill="#ffffff" font-weight="700">ACTIVE &amp; BUILDING</tspan></text>

    <!-- Pill 2: Education -->
    <rect x="237" y="0" width="250" height="28" rx="14" fill="url(#chipBg)" stroke="#3f3f46" stroke-width="1" />
    <text x="250" y="18" fill="#a1a1aa" class="text-mono">FOCUS: <tspan fill="#f4f4f5">CSE (AI &amp; ML) @ KIET</tspan></text>

    <!-- Pill 3: Internship -->
    <rect x="499" y="0" width="235" height="28" rx="14" fill="url(#chipBg)" stroke="#3f3f46" stroke-width="1" />
    <text x="512" y="18" fill="#a1a1aa" class="text-mono">EXP: <tspan fill="#e4e4e7">EX-DECODELABS INTERN</tspan></text>

    <!-- Pill 4: Terminal Mode -->
    <rect x="746" y="0" width="209" height="28" rx="14" fill="url(#chipBg)" stroke="#3f3f46" stroke-width="1" />
    <text x="760" y="18" fill="#ffffff" class="text-mono">&gt; harshit.init()<tspan fill="#71717a">_</tspan></text>
  </g>

  <!-- Hero Title Section -->
  <g transform="translate(45, 134)">
    <!-- Title Shadow for Depth -->
    <text x="0" y="1" fill="#000000" font-size="56" class="title-bold" opacity="0.8">HARSHIT SAINI</text>
    <!-- Foreground Metallic Title -->
    <text x="0" y="0" fill="url(#monoTitle)" font-size="56" class="title-bold">HARSHIT SAINI</text>

    <!-- Subtitle -->
    <text x="2" y="32" fill="#a1a1aa" font-size="13.5" class="subtitle-clean">
      AI &amp; FULL STACK DEVELOPER <tspan fill="#ffffff">•</tspan> SYSTEMS ARCHITECT
    </text>

    <!-- Description -->
    <text x="2" y="56" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12.5" font-weight="400">
      Designing production AI workflows, scalable web platforms &amp; deep neural models.
    </text>
  </g>

  <!-- Monochrome Tech Chips -->
  <g transform="translate(45, 238)">
    <!-- Chip 1 -->
    <g transform="translate(0, 0)">
      <rect width="176" height="38" rx="8" fill="url(#chipBg)" stroke="#3f3f46" stroke-width="1" />
      <text x="14" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="12" font-weight="600">
        ⬡ LLMs &amp; Transformers
      </text>
    </g>

    <!-- Chip 2 -->
    <g transform="translate(186, 0)">
      <rect width="176" height="38" rx="8" fill="url(#chipBg)" stroke="#3f3f46" stroke-width="1" />
      <text x="14" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="12" font-weight="600">
        ⬢ PyTorch &amp; FastAPI
      </text>
    </g>

    <!-- Chip 3 -->
    <g transform="translate(372, 0)">
      <rect width="176" height="38" rx="8" fill="url(#chipBg)" stroke="#3f3f46" stroke-width="1" />
      <text x="14" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="12" font-weight="600">
        ◈ React &amp; TypeScript
      </text>
    </g>

    <!-- Chip 4 -->
    <g transform="translate(558, 0)">
      <rect width="176" height="38" rx="8" fill="url(#chipBg)" stroke="#3f3f46" stroke-width="1" />
      <text x="14" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="12" font-weight="600">
        ❖ MERN &amp; MongoDB
      </text>
    </g>

    <!-- Chip 5 -->
    <g transform="translate(744, 0)">
      <rect width="168" height="38" rx="8" fill="url(#chipBg)" stroke="#3f3f46" stroke-width="1" />
      <text x="14" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="12" font-weight="600">
        ◆ Production Deployed
      </text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="318" width="1000" height="2" fill="url(#edgeGlow)" />
</svg>